services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fincontrol
      POSTGRES_PASSWORD: fincontrol
      POSTGRES_DB: fincontrol
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fincontrol -d fincontrol"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
